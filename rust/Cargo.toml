[package]
name = "yami"
version = "1.0.6"
edition = "2021"
build = "build.rs"

[lib]
name = "yami"

[[bin]]
name = "Yami"
path = "src/main.rs"

[[bin]]
name = "Yami-Setup"
path = "src/bin/setup.rs"
required-features = ["installer"]

[features]
installer = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security"] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
